# --- Documented at selection time, NOT shown to agent ---
minimum_reading_set:
  - zerver/lib/export.py                          # realm exporter — a ProcessPoolExecutor callsite + S3 download loop
  - zerver/lib/import_realm.py                     # realm importer — another callsite
  - zerver/lib/transfer.py                         # file-transfer between storage backends — a callsite
  - zerver/data_import/import_util.py              # shared importer helpers (attachment/avatar fan-out)
  - zerver/data_import/slack.py                    # one third-party importer callsite (pattern to consolidate)
  - zerver/worker/deferred_work.py                 # background worker — the queue-draining consumer
  - "an existing concurrent.futures.ProcessPoolExecutor usage"  # the duplicated pattern to factor out
  # Subtle requirement: each child process must drop the inherited DB connection (fork-safety);
  # the new unit test pins this. Must be discovered by reading how callsites use the DB.

red_herrings:
  - web/src/                                       # any export/import UI — out of scope (backend-only)
  - zerver/worker/                                 # other queue processors that use threads/asyncio but are NOT the deferred export/import work — must NOT be converted
  - zerver/lib/queue.py                            # RabbitMQ queue plumbing — unrelated to process-pool fan-out
  - "unrelated concurrent.futures / threading usages"  # concurrency elsewhere in the codebase that is not import/export

attributes:
  scatter: high          # 12 files across 4 dirs (lib/data_import/management.commands/worker)
  snr: low               # ~12 relevant files among hundreds of zerver/*.py
  red_herrings: medium   # other concurrency usages look convertible but are not in scope
  inferential_distance: medium  # must infer ONE primitive fits every callsite (map + queue variants)
  ambiguity: medium      # helper signature constrained by the union of all consumers
  coupling: wide         # horizontal fan-in — 12 disparate callsites must adopt one abstraction identically
  spec: under            # outcome + pinned public API specified; the callsite set must be discovered
