# --- Parent-commit note (NOT shown to agent) ---
# PR #28617 was REBASE-MERGED as 11 linear commits (131580f23c..0ee71c0a). The authoring
# scaler's `merge_commit_sha^` heuristic returned c15f426dc6 — which is the *10th commit of
# this PR itself* ("parallel: Refactor to provide a callback form"), NOT the pre-PR state.
# On c15f426 the gold diff does NOT apply (parallel.py already exists there). The true
# "before" state is the parent of the PR's first commit: 454905f988 ("mattermost_importer:
# Support converting duplicate channel names"). Verified: on 454905f988 both zerver/lib/
# parallel.py and zerver/tests/test_parallel.py are absent, and the full gold-backend +
# gold-tests diffs apply cleanly. parent_commit above is corrected to 454905f988.

description: |
  Zulip's realm data import and export code paths run several inherently
  parallelizable, CPU/IO-heavy batches of work — importing message
  attachments and avatars from third-party services (Slack, Mattermost,
  RocketChat), exporting a realm's uploaded files and re-encoding exported
  message data, transferring uploaded files between storage backends, and the
  background worker that performs deferred export/import work.

  Today much of this work runs serially, and where it does run concurrently
  the concurrency logic is duplicated — the same worker-process fan-out
  pattern is copy-pasted independently across these import/export code paths.

  Make this work run concurrently across multiple worker processes rather than
  serially, and consolidate the duplicated concurrency logic into a single
  shared helper so that every one of these code paths runs its parallel work
  through the same primitive. In particular:

  - The shared helper must expose two entry points:
    - `run_parallel` — run a function over many inputs across a pool of worker
      processes, yielding results as they complete.
    - `run_parallel_queue` — a queue-draining variant for producers that feed
      work items to be processed concurrently (used by the deferred-work
      background worker).
    Place this helper in a new module `zerver/lib/parallel.py`.
  - Correctness across process boundaries: each worker process must NOT reuse a
    database connection inherited from the parent process — inherited
    connections must be dropped so each child establishes its own. Getting this
    wrong causes intermittent, hard-to-reproduce database errors under load.
  - Every existing import/export/transfer/worker code path that fans work out
    across processes must be routed through this shared helper; no code path
    may keep its own private copy of the process-pool logic.
  - Behavior must be preserved: imports, exports, and file transfers must
    produce the same results as before — this is a concurrency refactor, not a
    change in what the operations compute.
  - Additionally, downloading a realm's uploaded files from S3 during export
    must happen in parallel rather than one file at a time.

  Scope: BACKEND ONLY. Do not modify `web/` frontend code. The task is judged
  on backend correctness and on consolidating the duplicated concurrency logic
  across all affected code paths.

# --- Methodology note (NOT shown to agent) ---
# The gold tests (zerver/tests/test_parallel.py) import the exact public names
# `run_parallel`, `run_parallel_queue` (and the internal `_disconnect` helper) from
# `zerver.lib.parallel`. Because the gold test pins these public surfaces, the prompt is
# deliberately allowed to name `run_parallel`, `run_parallel_queue`, and the module path
# `zerver/lib/parallel.py` — the same documented exception as zulip-001. The skill under
# measurement is NOT "invent an API": it is (1) recognizing that the several independent
# ProcessPoolExecutor blocks scattered across data_import/, lib/, management/commands/, and
# worker/ are the SAME pattern and can share one abstraction, (2) designing a primitive whose
# signature fits every consumer (a parallel map for the importers/exporter AND a
# queue-draining variant for the worker), (3) handling the fork-safety gotcha (drop the
# inherited DB connection in each child), and (4) converting EVERY callsite consistently. The
# prompt does NOT name `ProcessPoolExecutor`, the individual callsites, `_disconnect`, or any
# of the 12 files — those must be discovered by exploring the repo.
#
# ORACLE VALIDITY (important — refactor task, honest caveat):
#   - test_parallel.py is NEW and imports from the NEW zerver/lib/parallel.py, so on the
#     unpatched parent it hard-fails with ImportError — a clean SWE-bench-style gate. This is
#     the PRIMARY correctness gate.
#   - The six EXISTING importer/export/mgmt test files PASS on the unpatched parent too (it's a
#     behavior-preserving refactor), so they do NOT discriminate "did nothing" from "did it
#     right". Their value is REGRESSION-AS-GATE: they fail if the refactor breaks a converted
#     callsite. Keep completeness/precision as first-class signals — for a consolidation
#     refactor, "converted all 12 files" IS much of the measured skill.

